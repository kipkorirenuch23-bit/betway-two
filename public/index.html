<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Form</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  background: #f1f3f6;
}

.container {
  width: 100%;
  max-width: 430px;
  padding: 30px;
  background: white;
  border-radius: 14px;
  box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

h2 {
  text-align: center;
  margin-top: 0;
  color: #222;
}

.description {
  text-align: center;
  color: #777;
  font-size: 14px;
  margin-bottom: 28px;
}

label {
  display: block;
  margin-bottom: 8px;
  font-weight: bold;
  font-size: 14px;
}

input, textarea {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 7px;
  margin-bottom: 20px;
  font-size: 15px;
  outline: none;
}

input:focus, textarea:focus {
  border-color: #229ED9;
}

textarea {
  height: 130px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 15px;
  background: #229ED9;
  border: none;
  color: white;
  font-weight: bold;
  font-size: 15px;
  border-radius: 7px;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

#status {
  text-align: center;
  margin-top: 17px;
  font-size: 14px;
}

.success {
  color: green;
}

.error {
  color: red;
}

.privacy {
  color: #888;
  text-align: center;
  font-size: 11px;
  line-height: 1.5;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

<h2>Contact Us</h2>

<p class="description">
Enter your phone number and send us a message.
</p>

<form id="contactForm">

<label for="phone">Phone Number</label>

<input
  type="tel"
  id="phone"
  placeholder="+254712345678"
  maxlength="20"
  required
>

<label for="message">Your Message</label>

<textarea
  id="message"
  placeholder="Write your message here..."
  maxlength="3000"
  required
></textarea>

<button type="submit" id="sendButton">
SEND MESSAGE
</button>

<div id="status" role="status" aria-live="polite"></div>

</form>

<p class="privacy">
By submitting, you agree that your phone number and
message will be sent to our Telegram account.
</p>

</div>

<script>
const form = document.getElementById("contactForm");
const button = document.getElementById("sendButton");
const statusBox = document.getElementById("status");

form.addEventListener("submit", async function(e) {
  e.preventDefault();

  const phone = document.getElementById("phone").value.trim();
  const message = document.getElementById("message").value.trim();

  statusBox.textContent = "";
  statusBox.className = "";

  if (!/^[0-9+()\-\s]{7,20}$/.test(phone)) {
    statusBox.textContent = "Enter a valid phone number.";
    statusBox.className = "error";
    return;
  }

  if (!message) {
    statusBox.textContent = "Please write your message.";
    statusBox.className = "error";
    return;
  }

  button.disabled = true;
  button.textContent = "SENDING...";

  try {
    const response = await fetch("/api/telegram", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        phone: phone,
        message: message
      })
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.error || "Message delivery failed.");
    }

    statusBox.textContent = "Message sent successfully!";
    statusBox.className = "success";
    form.reset();

  } catch (error) {
    statusBox.textContent = error.message;
    statusBox.className = "error";

  } finally {
    button.disabled = false;
    button.textContent = "SEND MESSAGE";
  }
});
</script>

</body>
</html>
